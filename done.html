<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitFlow — Workout complete</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/done.css">

  <script type="module" src="js/pages/done.js"></script>
</head>
<body class="page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="frame">
    <noscript><p class="notice">Enable JavaScript to build and follow your workout.</p></noscript>

    <header class="site-header">
      <a class="logo" href="index.html">FitFlow</a>
      <nav aria-label="Steps">
        <ol class="stepper">
          <li class="stepper__step is-done"><span class="stepper__badge">✓</span>Choose</li>
          <li class="stepper__step is-done"><span class="stepper__badge">✓</span>Train</li>
          <li class="stepper__step is-current" aria-current="step"><span class="stepper__badge">3</span>Done</li>
        </ol>
      </nav>
    </header>

    <main id="main-content" tabindex="-1" class="site-main done">

      <!-- Left: the numbers, the actions and the completed routine -->
      <section class="done__hero" aria-label="Summary">
        <span class="caption done__date" id="done-date"></span>
        <h1 class="heading done__title">Workout complete</h1>

        <div class="stat-grid">
          <div class="stat">
            <span class="stat__value tabular" id="stat-minutes"></span>
            <span class="caption" id="stat-minutes-label">minutes</span>
          </div>
          <div class="stat">
            <span class="stat__value tabular" id="stat-exercises"></span>
            <span class="caption">exercises</span>
          </div>
          <div class="stat">
            <span class="stat__value tabular" id="stat-sets"></span>
            <span class="caption">sets</span>
          </div>
        </div>

        <div class="done__actions">
          <button class="button button--secondary button--large" id="save-plan" type="button">Save plan</button>
          <a class="button button--primary button--large" href="index.html">Done</a>
        </div>

        <p class="toast" id="save-toast" role="status"></p>

        <section class="done__deck" aria-label="Exercises done">
          <span class="caption">Your routine</span>
          <!-- One row per exercise, added by js/pages/done.js -->
          <ol class="plan-list" id="done-list"></ol>
        </section>
      </section>

      <!-- Right: which areas were trained -->
      <section class="panel done__map" aria-label="Areas trained">
        <span class="caption">You trained</span>
        <div class="panel--inset">
          <!-- Drawn by js/components/body-map.js -->
          <div id="trained-map"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- One row of the routine, copied by js/components/plan-item.js -->
  <template id="plan-item-template">
    <li class="plan-item">
      <div class="plan-item__row">
        <div class="plan-item__thumb">
          <img class="plan-item__image" alt="" width="80" height="60">
        </div>
        <div class="plan-item__body">
          <h3><button class="plan-item__name" type="button" aria-expanded="false"></button></h3>
          <span class="plan-item__area"></span>
        </div>
        <span class="plan-item__amount tabular"></span>
        <span class="plan-item__check" aria-label="Completed">✓</span>
      </div>
      <!-- The preview panel below is moved in here when the row is opened -->
      <div class="plan-item__preview"></div>
    </li>
  </template>

  <!-- The video and guide of one exercise, wired up by js/components/exercise-preview.js -->
  <template id="exercise-preview-template">
    <div class="exercise-preview">
      <div class="exercise-video">
        <div class="exercise-video__media">
          <img class="exercise-video__poster" alt="">
          <iframe class="exercise-video__player" title="Video demonstration" allowfullscreen hidden></iframe>
          <button class="button button--primary exercise-video__watch" type="button">Watch video</button>
        </div>
        <div class="exercise-video__footer">
          <a class="exercise-video__link" target="_blank" rel="noopener"></a>
          <button class="button button--secondary button--small exercise-video__restore" type="button" hidden>Show illustration</button>
        </div>
      </div>

      <details class="exercise-guide">
        <summary class="exercise-guide__summary">Movement guide</summary>
        <p class="exercise-guide__setup"></p>
        <p class="exercise-guide__status" role="status"></p>
        <div class="exercise-guide__instructions"></div>
        <p class="exercise-guide__muscles"></p>
        <p class="exercise-guide__credit" hidden>
          <a class="exercise-guide__source" target="_blank" rel="noopener"></a> ·
          <span class="exercise-guide__author"></span> ·
          <a class="exercise-guide__license" target="_blank" rel="noopener"></a> ·
          Formatting simplified.
        </p>
        <button class="button button--secondary button--small exercise-guide__retry" type="button" hidden>Try again</button>
      </details>
    </div>
  </template>
</body>
</html>
