<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forma — Workout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/workout.css">

  <script type="module" src="js/pages/workout.js"></script>
</head>
<body class="page">
  <div class="frame">

    <header class="site-header">
      <a class="logo" href="index.html">Forma</a>
      <nav aria-label="Steps">
        <ol class="stepper">
          <li class="stepper__step is-done"><span class="stepper__badge">✓</span>Choose</li>
          <li class="stepper__step is-current" aria-current="step"><span class="stepper__badge">2</span>Train</li>
          <li class="stepper__step"><span class="stepper__badge">3</span>Done</li>
        </ol>
      </nav>
      <a class="button button--ghost button--danger site-header__end" id="end-workout" href="index.html">
        <svg class="line-icon line-icon--small" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        End workout
      </a>
    </header>

    <main class="site-main workout">

      <h1 class="heading workout__title" id="workout-title"></h1>

      <section class="player" aria-label="Current exercise">

        <!-- The exercise, with its details on top -->
        <div class="player__canvas">
          <img class="player__image" id="exercise-image" alt="">

          <div class="player__top">
            <div class="player__meta">
              <span class="badge-live"><span class="badge-live__dot"></span>Now performing</span>
              <h2 class="heading player__exercise" id="exercise-name"></h2>
              <p class="player__counter tabular">
                <span id="set-counter"></span> · Target: <strong><span id="set-amount"></span> <span id="set-unit"></span></strong>
              </p>
            </div>

            <div class="up-next">
              <img class="up-next__image" id="up-next-image" alt="">
              <span class="up-next__text">
                <span class="caption">Up next</span>
                <span class="up-next__name" id="up-next-name"></span>
              </span>
            </div>
          </div>
        </div>

        <!-- Controls strip -->
        <div class="player__controls">
          <!-- One segment per exercise, added by js/pages/workout.js -->
          <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Workout progress" aria-valuemin="1"></div>

          <!-- Shown while doing a set -->
          <div class="set-view" id="set-view">
            <p class="player__hint">Finish the set, then rest before the next one.</p>
            <button class="button button--primary button--large" id="done-set" type="button">Done set</button>
            <a class="button button--primary button--large" id="finish-workout" href="done.html" hidden>Finish workout</a>
          </div>

          <!-- Shown between sets -->
          <div class="rest-view" id="rest-view" hidden>
            <div class="rest-widget">
              <div class="rest-timer" id="rest-timer" role="img" aria-label="45 seconds of rest left">
                <svg class="rest-timer__ring" viewBox="0 0 64 64" aria-hidden="true">
                  <circle class="rest-timer__track" cx="32" cy="32" r="28"/>
                  <circle class="rest-timer__progress" cx="32" cy="32" r="28" pathLength="100"/>
                </svg>
                <span class="rest-timer__time tabular">0:45</span>
              </div>
              <div class="rest-widget__info">
                <span class="rest-widget__title">Rest interval active</span>
                <span class="rest-widget__desc">Breathe and prepare for <strong id="rest-next"></strong></span>
              </div>
            </div>
            <div class="player__buttons">
              <button class="button button--secondary" id="add-rest" type="button">+15 s</button>
              <button class="button button--primary" id="skip-rest" type="button">Skip rest</button>
            </div>
          </div>
        </div>

      </section>
    </main>
  </div>
</body>
</html>
